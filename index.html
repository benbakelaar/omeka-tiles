<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Omeka Library</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Omeka Library</h1>

    <!-- Choose live API or a stored dated folder (shown only if stored copies exist) -->
    <div id="source-row" hidden>
      <label>
        Display from
        <select id="source">
          <option value="live">Live (Omeka API)</option>
        </select>
      </label>
    </div>

    <div id="live-panel">
      <!-- Step 1: connect to an Omeka S API -->
      <form id="connect-form">
        <label>
          API endpoint
          <input id="endpoint" type="url" placeholder="https://example.org/api" required>
        </label>
        <button type="submit">Connect</button>
        <span id="total"></span>
      </form>

      <!-- Step 2: load items (enabled once connected) -->
      <fieldset id="actions" disabled>
        <form id="add-form">
          <label>
            Omeka ID
            <input id="item-id" type="number" min="1" placeholder="e.g. 42" required>
          </label>
          <button type="submit">Add item</button>
        </form>
        <button id="scan-btn" type="button">Scan for next 10</button>
        <button id="scan-all-btn" type="button">Scan all</button>
      </fieldset>
    </div>

    <!-- Shown when displaying a stored folder whose scan didn't finish -->
    <div id="stored-panel" hidden>
      <button id="resume-btn" type="button">Resume scan</button>
      <span id="resume-info"></span>
    </div>

    <!-- Scan-all progress (shown while a full scan runs) -->
    <div id="scan-all-panel" hidden>
      <progress id="scan-progress" value="0" max="1"></progress>
      <span id="scan-progress-text"></span>
      <button id="continue-btn" type="button" hidden>Continue</button>
      <button id="stop-btn" type="button">Stop</button>
    </div>

    <!-- Tile / Data view toggle -->
    <div id="view-row">
      <span class="toggle">
        <button id="tile-view-btn" type="button" class="active">Tile</button><button id="data-view-btn" type="button">Data</button>
      </span>
      <button id="download-btn" type="button" hidden>Download CSV</button>
    </div>

    <p id="status" role="status"></p>
  </header>

  <!-- Page through stored folders (100 items per page) -->
  <nav id="pager" hidden>
    <button id="prev-btn" type="button">‹ Prev</button>
    <label>Page <input id="page-input" type="number" min="1" value="1"> of <span id="page-count">1</span></label>
    <button id="next-btn" type="button">Next ›</button>
    <span id="page-info"></span>
  </nav>

  <main id="grid"></main>
  <pre id="data-view" hidden></pre>

  <script src="app.js"></script>
</body>
</html>
