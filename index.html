<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Omeka Library</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Omeka Library</h1>

    <!-- Step 1: connect to an Omeka S API -->
    <form id="connect-form">
      <label>
        API endpoint
        <input id="endpoint" type="url" placeholder="https://example.org/api" required>
      </label>
      <button type="submit">Connect</button>
      <span id="total"></span>
    </form>

    <!-- Step 2: load items (enabled once connected) -->
    <fieldset id="actions" disabled>
      <form id="add-form">
        <label>
          Omeka ID
          <input id="item-id" type="number" min="1" placeholder="e.g. 42" required>
        </label>
        <button type="submit">Add item</button>
      </form>
      <button id="scan-btn" type="button">Scan for next 10</button>
    </fieldset>

    <p id="status" role="status"></p>
  </header>

  <main id="grid"></main>

  <script src="app.js"></script>
</body>
</html>
